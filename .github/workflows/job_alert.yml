name: Job Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2,10 * * *' # 每天北京时间 10:00 和 18:00

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests  # <--- 关键是这一行，确保它存在

      - name: Run Script
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          UPWORK_RSS: ${{ secrets.UPWORK_RSS }}
        run: python job_monitor.py
